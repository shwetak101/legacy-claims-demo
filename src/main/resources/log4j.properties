# Log4j 1.x configuration
# Team standard since 2014. DO NOT MIGRATE TO LOG4J2
# without Architecture Review Board approval (CLM-2871).

log4j.rootLogger=DEBUG, CONSOLE, FILE

log4j.appender.CONSOLE=org.apache.log4j.ConsoleAppender
log4j.appender.CONSOLE.layout=org.apache.log4j.PatternLayout
log4j.appender.CONSOLE.layout.ConversionPattern=%d{ISO8601} %-5p [%t] %c{1}:%L - %m%n

log4j.appender.FILE=org.apache.log4j.RollingFileAppender
log4j.appender.FILE.File=logs/claims-service.log
log4j.appender.FILE.MaxFileSize=50MB
log4j.appender.FILE.MaxBackupIndex=10
log4j.appender.FILE.layout=org.apache.log4j.PatternLayout
log4j.appender.FILE.layout.ConversionPattern=%d{ISO8601} %-5p [%t] %c{1}:%L - %m%n

# Set SQL logs to DEBUG for troubleshooting
log4j.logger.org.springframework.jdbc=DEBUG
log4j.logger.com.infy.claims=DEBUG
